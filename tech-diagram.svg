<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A4D"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E07A1F"/></marker>
  </defs>
  <rect width="1000" height="590" fill="#ffffff"/>
  <text x="40" y="40" font-size="26" font-weight="bold" fill="#1F3A4D" font-family="Cambria, Georgia, serif">How the technology fits together</text>

  <!-- top row -->
  <rect x="40" y="80" width="180" height="70" rx="8" fill="#EEF3F5"/>
  <text x="130" y="110" font-size="15" font-weight="bold" fill="#1D2430" text-anchor="middle">Teammates</text>
  <text x="130" y="132" font-size="13" fill="#1D2430" text-anchor="middle">edit files (collaborators)</text>

  <rect x="290" y="80" width="220" height="70" rx="8" fill="#EEF3F5"/>
  <text x="400" y="110" font-size="15" font-weight="bold" fill="#1D2430" text-anchor="middle">GitHub repo</text>
  <text x="400" y="132" font-size="13" fill="#1D2430" text-anchor="middle">index.html, slides.html</text>

  <rect x="580" y="80" width="220" height="70" rx="8" fill="#2A7F8E"/>
  <text x="690" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub Pages</text>
  <text x="690" y="132" font-size="13" fill="#ffffff" text-anchor="middle">free hosting, public URL</text>

  <line x1="220" y1="115" x2="288" y2="115" stroke="#1F3A4D" stroke-width="2" marker-end="url(#a)"/>
  <text x="255" y="105" font-size="12" fill="#55606B" text-anchor="middle">commit</text>
  <line x1="510" y1="115" x2="578" y2="115" stroke="#1F3A4D" stroke-width="2" marker-end="url(#a)"/>
  <text x="545" y="105" font-size="12" fill="#55606B" text-anchor="middle">auto-deploy</text>

  <!-- pages to browser -->
  <line x1="620" y1="150" x2="620" y2="228" stroke="#1F3A4D" stroke-width="2" marker-end="url(#a)"/>
  <text x="632" y="195" font-size="12" fill="#55606B">serves static files</text>

  <!-- browser -->
  <rect x="40" y="230" width="640" height="270" rx="10" fill="#ffffff" stroke="#1F3A4D" stroke-width="2"/>
  <text x="60" y="258" font-size="15" font-weight="bold" fill="#1F3A4D">Visitor's browser (everything runs here today)</text>

  <rect x="60" y="280" width="170" height="120" rx="8" fill="#EEF3F5"/>
  <text x="145" y="312" font-size="14" font-weight="bold" fill="#1D2430" text-anchor="middle">Page</text>
  <text x="145" y="336" font-size="13" fill="#1D2430" text-anchor="middle">HTML + CSS</text>
  <text x="145" y="356" font-size="13" fill="#1D2430" text-anchor="middle">list, forms, ledger</text>

  <rect x="270" y="280" width="170" height="120" rx="8" fill="#EEF3F5"/>
  <text x="355" y="312" font-size="14" font-weight="bold" fill="#1D2430" text-anchor="middle">Logic</text>
  <text x="355" y="336" font-size="13" fill="#1D2430" text-anchor="middle">JavaScript: ZIP check,</text>
  <text x="355" y="356" font-size="13" fill="#1D2430" text-anchor="middle">local-first window,</text>
  <text x="355" y="376" font-size="13" fill="#1D2430" text-anchor="middle">bids, local share</text>

  <rect x="480" y="280" width="170" height="120" rx="8" fill="#EEF3F5"/>
  <text x="565" y="312" font-size="14" font-weight="bold" fill="#1D2430" text-anchor="middle">Data</text>
  <text x="565" y="336" font-size="13" fill="#1D2430" text-anchor="middle">sample data in code;</text>
  <text x="565" y="356" font-size="13" fill="#1D2430" text-anchor="middle">bids in localStorage</text>
  <text x="565" y="376" font-size="13" fill="#1D2430" text-anchor="middle">(this browser only)</text>

  <line x1="230" y1="340" x2="268" y2="340" stroke="#1F3A4D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="340" x2="478" y2="340" stroke="#1F3A4D" stroke-width="2" marker-end="url(#a)"/>

  <text x="60" y="440" font-size="13" font-weight="bold" fill="#E07A1F">Current limits</text>
  <text x="60" y="462" font-size="13" fill="#1D2430">No shared data between users · ZIP can be faked · English only · sample data is illustrative</text>

  <!-- next stage -->
  <text x="720" y="248" font-size="14" font-weight="bold" fill="#E07A1F">NEXT STAGE (planned, not built)</text>
  <rect x="720" y="270" width="250" height="110" rx="8" fill="#ffffff" stroke="#E07A1F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="845" y="302" font-size="14" font-weight="bold" fill="#1D2430" text-anchor="middle">Supabase or Firebase</text>
  <text x="845" y="326" font-size="13" fill="#1D2430" text-anchor="middle">shared database</text>
  <text x="845" y="346" font-size="13" fill="#1D2430" text-anchor="middle">company login</text>
  <text x="845" y="366" font-size="13" fill="#1D2430" text-anchor="middle">server-side timing</text>

  <rect x="720" y="410" width="250" height="90" rx="8" fill="#ffffff" stroke="#E07A1F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="845" y="442" font-size="14" font-weight="bold" fill="#1D2430" text-anchor="middle">Human reviewer</text>
  <text x="845" y="466" font-size="13" fill="#1D2430" text-anchor="middle">verifies local status</text>
  <text x="845" y="486" font-size="13" fill="#1D2430" text-anchor="middle">of each company</text>

  <line x1="680" y1="325" x2="718" y2="325" stroke="#E07A1F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <line x1="845" y1="380" x2="845" y2="408" stroke="#E07A1F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>

  <!-- legend -->
  <line x1="40" y1="548" x2="90" y2="548" stroke="#1F3A4D" stroke-width="2"/>
  <text x="100" y="553" font-size="13" fill="#1D2430">built (prototype)</text>
  <line x1="260" y1="548" x2="310" y2="548" stroke="#E07A1F" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="553" font-size="13" fill="#1D2430">planned after the hackathon</text>
</svg>
